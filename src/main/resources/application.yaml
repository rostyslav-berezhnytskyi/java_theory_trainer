spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: java-theory-trainer

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${SPRING_JPA_FORMAT_SQL:false}

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

server:
  servlet:
    session:
      timeout: ${APP_SESSION_TIMEOUT:7d}

app:
  security:
    username: ${APP_SECURITY_USERNAME}
    password: ${APP_SECURITY_PASSWORD}
    remember-me-key: ${APP_SECURITY_REMEMBER_ME_KEY:${APP_SECURITY_PASSWORD}}
    remember-me-validity-seconds: ${APP_SECURITY_REMEMBER_ME_VALIDITY_SECONDS:2592000}

  uploads:
    root: ${APP_UPLOADS_ROOT}

  ai:
    enabled: ${APP_AI_ENABLED:true}
    openai-api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5.4-mini}
    transcription-model: ${OPENAI_TRANSCRIPTION_MODEL:gpt-4o-transcribe}
    tts-model: ${OPENAI_TTS_MODEL:gpt-4o-mini-tts}
    tts-voice: ${OPENAI_TTS_VOICE:marin}
    chat-max-output-tokens: ${OPENAI_CHAT_MAX_OUTPUT_TOKENS:3000}
    timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:45}
