<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin/fragments/layout :: head('Питання')}"></head>

<body>
<div class="app-shell">

    <div th:replace="~{admin/fragments/layout :: sidebar('questions')}"></div>

    <main class="main">
        <div th:replace="~{admin/fragments/layout :: topbar('Питання')}"></div>

        <section class="card">
            <div class="card-header">
                <div>
                    <h2 class="card-title">Список питань</h2>
                    <div class="card-subtitle"
                         th:if="${questionsPage != null}"
                         th:text="'Showing ' + ${questionsPage.numberOfElements} + ' of ' + ${questionsPage.totalElements} + ' questions'">
                        Showing 20 of 90 questions
                    </div>
                </div>

                <a class="btn btn-primary" th:href="@{/admin/questions/new}">
                    + Додати питання
                </a>
            </div>

            <form class="filter-panel" th:action="@{/admin/questions}" method="get">
                <div class="filter-grid filter-grid-6">
                    <div class="form-group">
                        <label class="form-label" for="questionSearch">Search</label>
                        <input class="form-control"
                               id="questionSearch"
                               type="search"
                               name="search"
                               th:value="${search}"
                               placeholder="Question, volume, category">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="volumeFilter">Volume</label>
                        <select class="form-control"
                                id="volumeFilter"
                                name="volumeId"
                                data-basic-select
                                data-placeholder="Any volume">
                            <option value="">Any volume</option>
                            <option th:each="volume : ${volumes}"
                                    th:value="${volume.id}"
                                    th:selected="${selectedVolumeId != null && selectedVolumeId == volume.id}"
                                    th:text="${volume.title}">
                                Java Core
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="sectionFilter">Category</label>
                        <select class="form-control"
                                id="sectionFilter"
                                name="sectionId"
                                data-basic-select
                                data-placeholder="Any category">
                            <option value="">Any category</option>
                            <option th:each="section : ${sections}"
                                    th:value="${section.id}"
                                    th:selected="${selectedSectionId != null && selectedSectionId == section.id}"
                                    th:text="${section.volume.title + ' / ' + section.title}">
                                Java Core / JVM
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="tagFilter">Tag</label>
                        <input class="form-control"
                               id="tagFilter"
                               type="search"
                               name="tag"
                               th:value="${selectedTag}"
                               placeholder="jvm">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="difficultyFilter">Difficulty</label>
                        <select class="form-control" id="difficultyFilter" name="difficulty">
                            <option value="">Any difficulty</option>
                            <option th:each="difficulty : ${difficulties}"
                                    th:value="${difficulty}"
                                    th:selected="${selectedDifficulty == difficulty}"
                                    th:text="${difficulty}">
                                MEDIUM
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="statusFilter">Status</label>
                        <select class="form-control" id="statusFilter" name="status">
                            <option value="">Any status</option>
                            <option th:each="status : ${statuses}"
                                    th:value="${status}"
                                    th:selected="${selectedStatus == status}"
                                    th:text="${status}">
                                ACTIVE
                            </option>
                        </select>
                    </div>
                </div>

                <div class="filter-actions">
                    <button class="btn btn-primary" type="submit">Apply filters</button>
                    <a class="btn btn-secondary" th:href="@{/admin/questions}">Clear</a>
                </div>
            </form>

            <table class="table compact-list-table question-list-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Том</th>
                    <th>Розділ</th>
                    <th>Питання</th>
                    <th>Practice</th>
                    <th>Складність</th>
                    <th>Статус</th>
                    <th>Порядок</th>
                    <th>Дії</th>
                </tr>
                </thead>

                <tbody>
                <tr class="clickable-row"
                    th:each="question : ${questions}"
                    th:data-row-href="@{/admin/questions/{id}(id=${question.id})}">
                    <td data-label="ID" th:text="${question.id}">1</td>
                    <td data-label="Том" th:text="${question.section.volume.title}">Java Core</td>
                    <td data-label="Розділ" th:text="${question.section.title}">JVM, Memory</td>
                    <td data-label="Питання">
                        <div class="question-preview" th:text="${question.questionText}">
                            Що таке JVM?
                        </div>
                    </td>
                    <td data-label="Practice">
                        <div class="progress-cell">
                            <strong>
                                <span th:text="${question.goodCount + question.easyCount}">0</span>
                                <span> / </span>
                                <span th:text="${question.timesShown}">0</span>
                                <span> / 1</span>
                            </strong>
                            <span>
                                A:<span th:text="${question.againCount}">0</span>
                                H:<span th:text="${question.hardCount}">0</span>
                                G:<span th:text="${question.goodCount}">0</span>
                                E:<span th:text="${question.easyCount}">0</span>
                            </span>
                        </div>
                    </td>
                    <td data-label="Складність" th:text="${question.difficulty}">MEDIUM</td>
                    <td data-label="Статус">
                        <span th:if="${question.status.name() == 'ACTIVE'}" class="badge badge-green">
                            ACTIVE
                        </span>
                        <span th:if="${question.status.name() == 'DRAFT'}" class="badge badge-gray">
                            DRAFT
                        </span>
                        <span th:if="${question.status.name() == 'ARCHIVED'}" class="badge badge-gray">
                            ARCHIVED
                        </span>
                    </td>
                    <td data-label="Порядок" th:text="${question.sortOrder}">0</td>
                    <td data-label="Дії" class="actions-cell">
                        <div class="actions">
                            <a class="btn btn-small"
                               th:href="@{/admin/questions/{id}/edit(id=${question.id})}">
                                Редагувати
                            </a>

                            <form class="inline-form"
                                  th:action="@{/admin/questions/{id}/reset-practice(id=${question.id})}"
                                  method="post"
                                  onsubmit="return confirm('Reset practice stats for this question?');">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button class="btn btn-small btn-secondary" type="submit">
                                    Reset
                                </button>
                            </form>

                            <form th:if="${question.status.name() != 'ARCHIVED'}"
                                  class="inline-form"
                                  th:action="@{/admin/questions/{id}/archive(id=${question.id})}"
                                  method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button class="btn btn-small btn-danger" type="submit">
                                    Архів
                                </button>
                            </form>

                            <form th:if="${question.status.name() == 'ARCHIVED'}"
                                  class="inline-form"
                                  th:action="@{/admin/questions/{id}/activate(id=${question.id})}"
                                  method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button class="btn btn-small btn-primary" type="submit">
                                    Активувати
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(questions)}">
                    <td colspan="9">Поки немає жодного питання.</td>
                </tr>
                </tbody>
            </table>

            <nav class="pagination"
                 th:if="${totalPages != null && totalPages > 1}"
                 aria-label="Questions pages">
                <a class="pagination-link"
                   th:classappend="${questionsPage.first} ? ' disabled'"
                   th:href="${questionsPage.first} ? '#' : @{/admin/questions(page=${currentPage - 1}, search=${search}, volumeId=${selectedVolumeId}, sectionId=${selectedSectionId}, tag=${selectedTag}, difficulty=${selectedDifficulty}, status=${selectedStatus})}">
                    Previous
                </a>

                <a class="pagination-link"
                   th:each="pageNumber : ${#numbers.sequence(1, totalPages)}"
                   th:classappend="${pageNumber == currentPage} ? ' active'"
                   th:href="@{/admin/questions(page=${pageNumber}, search=${search}, volumeId=${selectedVolumeId}, sectionId=${selectedSectionId}, tag=${selectedTag}, difficulty=${selectedDifficulty}, status=${selectedStatus})}"
                   th:text="${pageNumber}">
                    1
                </a>

                <a class="pagination-link"
                   th:classappend="${questionsPage.last} ? ' disabled'"
                   th:href="${questionsPage.last} ? '#' : @{/admin/questions(page=${currentPage + 1}, search=${search}, volumeId=${selectedVolumeId}, sectionId=${selectedSectionId}, tag=${selectedTag}, difficulty=${selectedDifficulty}, status=${selectedStatus})}">
                    Next
                </a>
            </nav>
        </section>
    </main>

</div>
</body>
</html>
