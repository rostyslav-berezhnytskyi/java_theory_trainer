<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin/fragments/layout :: head('Перегляд тому')}"></head>

<body>
<div class="app-shell">

    <div th:replace="~{admin/fragments/layout :: sidebar('volumes')}"></div>

    <main class="main">
        <div th:replace="~{admin/fragments/layout :: topbar('Перегляд тому')}"></div>

        <section class="card">
            <div class="card-header">
                <h2 class="card-title" th:text="${volume.title}">Java Core</h2>

                <div class="actions entity-view-actions">
                    <a class="btn" th:href="@{/admin/volumes}">← До списку</a>
                    <a class="btn btn-primary"
                       th:href="@{/admin/volumes/{id}/edit(id=${volume.id})}">
                        Редагувати
                    </a>
                    <form class="inline-form"
                          th:action="@{/admin/volumes/{id}/reset-practice(id=${volume.id})}"
                          method="post"
                          onsubmit="return confirm('Reset practice stats for all questions in this volume?');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-danger" type="submit">Reset practice</button>
                    </form>
                </div>
            </div>

            <div class="meta-grid entity-view-meta-grid">
                <div class="meta-item">
                    <div class="meta-label">ID</div>
                    <div class="meta-value" th:text="${volume.id}">1</div>
                </div>

                <div class="meta-item">
                    <div class="meta-label">Slug</div>
                    <div class="meta-value" th:text="${volume.slug}">java-core</div>
                </div>

                <div class="meta-item">
                    <div class="meta-label">Статус</div>
                    <div class="meta-value" th:text="${volume.active ? 'Активний' : 'Архів'}">Активний</div>
                </div>

                <div class="meta-item">
                    <div class="meta-label">Порядок</div>
                    <div class="meta-value" th:text="${volume.sortOrder}">0</div>
                </div>

                <div class="meta-item">
                    <div class="meta-label">Створено</div>
                    <div class="meta-value" th:text="${volume.createdAt}">—</div>
                </div>

                <div class="meta-item">
                    <div class="meta-label">Оновлено</div>
                    <div class="meta-value" th:text="${volume.updatedAt}">—</div>
                </div>

                <div class="meta-item">
                    <div class="meta-label">Practice progress</div>
                    <div class="meta-value" th:if="${volumeStats != null}" th:text="${volumeStats.progressText()}">0 / 0 / 0</div>
                    <div class="meta-value" th:if="${volumeStats == null}">0 / 0 / 0</div>
                    <div class="meta-help" th:if="${volumeStats != null}" th:text="${volumeStats.gradeText()}">A:0 H:0 G:0 E:0</div>
                </div>
            </div>

            <details class="content-block entity-description" open>
                <summary class="content-block-title entity-description-toggle">Опис</summary>
                <div class="content-box markdown-content"
                     th:if="${descriptionHtml != null && !descriptionHtml.isBlank()}"
                     th:utext="${descriptionHtml}">
                </div>
                <div class="content-box"
                     th:if="${descriptionHtml == null || descriptionHtml.isBlank()}">
                    —
                </div>
            </details>
            <div class="content-block">
                <h3 class="content-block-title">Categories in this volume</h3>

                <table class="table compact-list-table related-section-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Slug</th>
                        <th>Status</th>
                        <th>Order</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr class="clickable-row"
                        th:each="section : ${sections}"
                        th:data-row-href="@{/admin/sections/{id}(id=${section.id})}">
                        <td data-label="ID" th:text="${section.id}">1</td>
                        <td data-label="Name" th:text="${section.title}">JVM, Memory</td>
                        <td data-label="Slug" th:text="${section.slug}">jvm-memory</td>
                        <td data-label="Status">
                            <span th:if="${section.active}" class="badge badge-green">Active</span>
                            <span th:if="${!section.active}" class="badge badge-gray">Archived</span>
                        </td>
                        <td data-label="Order" th:text="${section.sortOrder}">0</td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(sections)}">
                        <td colspan="5">No categories in this volume yet.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

</div>
</body>
</html>
