<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin/fragments/layout :: head('Томи')}"></head>

<body>
<div class="app-shell">

    <div th:replace="~{admin/fragments/layout :: sidebar('volumes')}"></div>

    <main class="main">
        <div th:replace="~{admin/fragments/layout :: topbar('Томи')}"></div>

        <section class="card">
            <div class="card-header">
                <div>
                    <h2 class="card-title">Список томів</h2>
                    <div class="card-subtitle"
                         th:if="${volumesPage != null}"
                         th:text="'Showing ' + ${volumesPage.numberOfElements} + ' of ' + ${volumesPage.totalElements} + ' volumes'">
                        Showing 40 of 40 volumes
                    </div>
                </div>

                <a class="btn btn-primary" th:href="@{/admin/volumes/new}">
                    + Додати том
                </a>
            </div>

            <details class="filter-details">
                <summary class="filter-details-toggle">Search and filters</summary>
            <form class="filter-panel filter-panel-collapsible" th:action="@{/admin/volumes}" method="get">
                <div class="filter-grid filter-grid-2">
                    <div class="form-group">
                        <label class="form-label" for="volumeSearch">Search</label>
                        <input class="form-control"
                               id="volumeSearch"
                               type="search"
                               name="search"
                               th:value="${search}"
                               placeholder="Volume or slug">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="volumeStatusFilter">Status</label>
                        <select class="form-control" id="volumeStatusFilter" name="active">
                            <option value="">Any status</option>
                            <option value="true" th:selected="${selectedActive == true}">Active</option>
                            <option value="false" th:selected="${selectedActive == false}">Archived</option>
                        </select>
                    </div>
                </div>

                <div class="filter-actions">
                    <button class="btn btn-primary" type="submit">Apply filters</button>
                    <a class="btn btn-secondary" th:href="@{/admin/volumes}">Clear</a>
                </div>
            </form>
            </details>

            <table class="table compact-list-table volume-list-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Назва</th>
                    <th>Slug</th>
                    <th>Progress</th>
                    <th>Порядок</th>
                    <th>Статус</th>
                    <th>Дії</th>
                </tr>
                </thead>

                <tbody>
                <tr class="clickable-row"
                    th:each="volume : ${volumes}"
                    th:with="stats=${volumeStatsById[volume.id]}"
                    th:data-row-href="@{/admin/volumes/{id}(id=${volume.id})}">
                    <td data-label="ID" th:text="${volume.id}">1</td>
                    <td data-label="Назва" th:text="${volume.title}">Java Core</td>
                    <td data-label="Slug" th:text="${volume.slug}">java-core</td>
                    <td data-label="Progress">
                        <div class="progress-cell" th:if="${stats != null}">
                            <strong th:text="${stats.progressText()}">0 / 0 / 0</strong>
                            <span th:text="${stats.gradeText()}">A:0 H:0 G:0 E:0</span>
                        </div>
                        <span th:if="${stats == null}">0 / 0 / 0</span>
                    </td>
                    <td data-label="Порядок" th:text="${volume.sortOrder}">0</td>
                    <td data-label="Статус">
                        <span th:if="${volume.active}" class="badge badge-green">Активний</span>
                        <span th:if="${!volume.active}" class="badge badge-gray">Архів</span>
                    </td>
                    <td data-label="Дії" class="actions-cell">
                        <div class="actions">
                            <a class="btn btn-small"
                               th:href="@{/admin/volumes/{id}/edit(id=${volume.id})}">
                                Редагувати
                            </a>

                            <form class="inline-form"
                                  th:action="@{/admin/volumes/{id}/reset-practice(id=${volume.id})}"
                                  method="post"
                                  onsubmit="return confirm('Reset practice stats for all questions in this volume?');">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button class="btn btn-small btn-secondary" type="submit">
                                    Reset
                                </button>
                            </form>

                            <form th:if="${volume.active}"
                                  class="inline-form"
                                  th:action="@{/admin/volumes/{id}/archive(id=${volume.id})}"
                                  method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button class="btn btn-small btn-danger" type="submit">
                                    Архівувати
                                </button>
                            </form>

                            <form th:if="${!volume.active}"
                                  class="inline-form"
                                  th:action="@{/admin/volumes/{id}/activate(id=${volume.id})}"
                                  method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button class="btn btn-small btn-primary" type="submit">
                                    Активувати
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(volumes)}">
                    <td colspan="7">Поки немає жодного тому.</td>
                </tr>
                </tbody>
            </table>

            <nav class="pagination"
                 th:if="${totalPages != null && totalPages > 1}"
                 aria-label="Volume pages">
                <a class="pagination-link"
                   th:classappend="${volumesPage.first} ? ' disabled'"
                   th:href="${volumesPage.first} ? '#' : @{/admin/volumes(page=${currentPage - 1}, search=${search}, active=${selectedActive})}">
                    Previous
                </a>

                <a class="pagination-link"
                   th:each="pageNumber : ${#numbers.sequence(1, totalPages)}"
                   th:classappend="${pageNumber == currentPage} ? ' active'"
                   th:href="@{/admin/volumes(page=${pageNumber}, search=${search}, active=${selectedActive})}"
                   th:text="${pageNumber}">
                    1
                </a>

                <a class="pagination-link"
                   th:classappend="${volumesPage.last} ? ' disabled'"
                   th:href="${volumesPage.last} ? '#' : @{/admin/volumes(page=${currentPage + 1}, search=${search}, active=${selectedActive})}">
                    Next
                </a>
            </nav>
        </section>
    </main>

</div>
</body>
</html>
