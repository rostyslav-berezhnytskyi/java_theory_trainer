<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin/fragments/layout :: head('Розділи')}"></head>

<body>
<div class="app-shell">

    <div th:replace="~{admin/fragments/layout :: sidebar('sections')}"></div>

    <main class="main">
        <div th:replace="~{admin/fragments/layout :: topbar('Розділи')}"></div>

        <section class="card">
            <div class="card-header">
                <div>
                    <h2 class="card-title">Список розділів</h2>
                    <div class="card-subtitle"
                         th:if="${sectionsPage != null}"
                         th:text="'Showing ' + ${sectionsPage.numberOfElements} + ' of ' + ${sectionsPage.totalElements} + ' categories'">
                        Showing 20 of 90 categories
                    </div>
                </div>

                <a class="btn btn-primary" th:href="@{/admin/sections/new}">
                    + Додати розділ
                </a>
            </div>

            <form class="filter-panel" th:action="@{/admin/sections}" method="get">
                <div class="filter-grid filter-grid-3">
                    <div class="form-group">
                        <label class="form-label" for="sectionSearch">Search</label>
                        <input class="form-control"
                               id="sectionSearch"
                               type="search"
                               name="search"
                               th:value="${search}"
                               placeholder="Category, slug, volume">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="sectionVolumeFilter">Volume</label>
                        <select class="form-control"
                                id="sectionVolumeFilter"
                                name="volumeId"
                                data-basic-select
                                data-placeholder="Any volume">
                            <option value="">Any volume</option>
                            <option th:each="volume : ${volumes}"
                                    th:value="${volume.id}"
                                    th:selected="${selectedVolumeId != null && selectedVolumeId == volume.id}"
                                    th:text="${volume.title}">
                                Java Core
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="sectionStatusFilter">Status</label>
                        <select class="form-control" id="sectionStatusFilter" name="active">
                            <option value="">Any status</option>
                            <option value="true" th:selected="${selectedActive == true}">Active</option>
                            <option value="false" th:selected="${selectedActive == false}">Archived</option>
                        </select>
                    </div>
                </div>

                <div class="filter-actions">
                    <button class="btn btn-primary" type="submit">Apply filters</button>
                    <a class="btn btn-secondary" th:href="@{/admin/sections}">Clear</a>
                </div>
            </form>

            <table class="table compact-list-table section-list-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Том</th>
                    <th>Назва</th>
                    <th>Slug</th>
                    <th>Progress</th>
                    <th>Порядок</th>
                    <th>Статус</th>
                    <th>Дії</th>
                </tr>
                </thead>

                <tbody>
                <tr class="clickable-row"
                    th:each="section : ${sections}"
                    th:with="stats=${sectionStatsById[section.id]}"
                    th:data-row-href="@{/admin/sections/{id}(id=${section.id})}">
                    <td data-label="ID" th:text="${section.id}">1</td>
                    <td data-label="Том" th:text="${section.volume.title}">Java Core</td>
                    <td data-label="Назва" th:text="${section.title}">JVM, Memory</td>
                    <td data-label="Slug" th:text="${section.slug}">jvm-memory</td>
                    <td data-label="Progress">
                        <div class="progress-cell" th:if="${stats != null}">
                            <strong th:text="${stats.progressText()}">0 / 0 / 0</strong>
                            <span th:text="${stats.gradeText()}">A:0 H:0 G:0 E:0</span>
                        </div>
                        <span th:if="${stats == null}">0 / 0 / 0</span>
                    </td>
                    <td data-label="Порядок" th:text="${section.sortOrder}">0</td>
                    <td data-label="Статус">
                        <span th:if="${section.active}" class="badge badge-green">Активний</span>
                        <span th:if="${!section.active}" class="badge badge-gray">Архів</span>
                    </td>
                    <td data-label="Дії" class="actions-cell">
                        <div class="actions">
                            <a class="btn btn-small btn-secondary"
                               th:href="@{/admin/sections/{id}(id=${section.id})}">
                                Перегляд
                            </a>

                            <a class="btn btn-small"
                               th:href="@{/admin/sections/{id}/edit(id=${section.id})}">
                                Редагувати
                            </a>

                            <form class="inline-form"
                                  th:action="@{/admin/sections/{id}/reset-practice(id=${section.id})}"
                                  method="post"
                                  onsubmit="return confirm('Reset practice stats for all questions in this section?');">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button class="btn btn-small btn-secondary" type="submit">
                                    Reset
                                </button>
                            </form>

                            <form th:if="${section.active}"
                                  class="inline-form"
                                  th:action="@{/admin/sections/{id}/archive(id=${section.id})}"
                                  method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button class="btn btn-small btn-danger" type="submit">
                                    Архівувати
                                </button>
                            </form>

                            <form th:if="${!section.active}"
                                  class="inline-form"
                                  th:action="@{/admin/sections/{id}/activate(id=${section.id})}"
                                  method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button class="btn btn-small btn-primary" type="submit">
                                    Активувати
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(sections)}">
                    <td colspan="8">Поки немає жодного розділу.</td>
                </tr>
                </tbody>
            </table>

            <nav class="pagination"
                 th:if="${totalPages != null && totalPages > 1}"
                 aria-label="Category pages">
                <a class="pagination-link"
                   th:classappend="${sectionsPage.first} ? ' disabled'"
                   th:href="${sectionsPage.first} ? '#' : @{/admin/sections(page=${currentPage - 1}, search=${search}, volumeId=${selectedVolumeId}, active=${selectedActive})}">
                    Previous
                </a>

                <a class="pagination-link"
                   th:each="pageNumber : ${#numbers.sequence(1, totalPages)}"
                   th:classappend="${pageNumber == currentPage} ? ' active'"
                   th:href="@{/admin/sections(page=${pageNumber}, search=${search}, volumeId=${selectedVolumeId}, active=${selectedActive})}"
                   th:text="${pageNumber}">
                    1
                </a>

                <a class="pagination-link"
                   th:classappend="${sectionsPage.last} ? ' disabled'"
                   th:href="${sectionsPage.last} ? '#' : @{/admin/sections(page=${currentPage + 1}, search=${search}, volumeId=${selectedVolumeId}, active=${selectedActive})}">
                    Next
                </a>
            </nav>
        </section>
    </main>

</div>
</body>
</html>
